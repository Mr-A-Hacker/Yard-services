<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <title>{{ service.name }} — Yard Services</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bitter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='themes/' + active_theme + '.css') }}">
  <style>body{ {% if bg_image %}background-image:url('{{ bg_image }}');background-position:{{ bg_position }};background-size:{{ bg_size }};background-repeat:{{ bg_repeat }};background-attachment:{{ bg_attachment }};{% endif %} }</style>

  <style>
    :root{--g-dark:#1a5c2a;--g-mid:#2d8a3e;--g-bright:#4caf50;--g-light:#c8e6c9;--g-pale:#f1f8f2;--gold:#f5a623;--white:#ffffff;--ink:#1a2e1c;--muted:#6a8f70;--shadow:0 8px 36px rgba(26,92,42,0.16);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background-color:var(--g-pale);min-height:100vh;display:flex;flex-direction:column;position:relative;}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(170deg,rgba(76,175,80,0.05) 0px,rgba(76,175,80,0.05) 20px,transparent 20px,transparent 40px);pointer-events:none;z-index:0;}

    .top-nav{background:linear-gradient(90deg,var(--g-dark),var(--g-mid));padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 16px rgba(0,0,0,0.2);position:sticky;top:0;z-index:100;}
    .top-nav .brand{font-family:'Bitter',serif;font-size:1.2rem;font-weight:900;color:white;text-decoration:none;display:flex;align-items:center;gap:10px;}
    .top-nav .brand .icon-badge{background:var(--gold);color:var(--g-dark);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;}
    .nav-back{color:var(--g-light);font-size:0.85rem;font-weight:700;text-decoration:none;padding:6px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,0.25);transition:background 0.2s;}
    .nav-back:hover{background:rgba(255,255,255,0.15);color:white;}

    .page-wrap{position:relative;z-index:1;max-width:580px;margin:48px auto 0;padding:0 16px 60px;flex:1;width:100%;}

    .detail-card{background:var(--white);border-radius:20px;border:1.5px solid var(--g-light);box-shadow:var(--shadow);overflow:hidden;animation:fadeUp 0.4s ease both;}

    .detail-img{width:100%;max-height:280px;object-fit:cover;}
    .detail-img-placeholder{width:100%;height:140px;background:linear-gradient(135deg,var(--g-light),var(--g-pale));display:flex;align-items:center;justify-content:center;font-size:3.5rem;}

    .detail-header{background:linear-gradient(90deg,var(--g-dark),var(--g-mid));padding:20px 28px;}
    .detail-header h2{font-family:'Bitter',serif;font-size:1.6rem;font-weight:900;color:white;margin:0;}

    .detail-body{padding:28px;}
    .detail-desc{font-size:1rem;font-weight:700;color:#444;line-height:1.7;margin-bottom:22px;}

    .price-block{background:linear-gradient(135deg,var(--g-pale),#e8f5e9);border:2px solid var(--g-bright);border-radius:14px;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
    .price-label{font-family:'Bitter',serif;font-weight:700;color:var(--g-dark);font-size:0.95rem;}
    .price-value{font-family:'Bitter',serif;font-size:2rem;font-weight:900;color:var(--g-dark);}

    .btn-request{display:block;width:100%;padding:15px;background:linear-gradient(135deg,var(--g-mid),var(--g-dark));color:white;font-family:'Bitter',serif;font-size:1.05rem;font-weight:700;border:none;border-radius:12px;text-align:center;text-decoration:none;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;box-shadow:0 4px 18px rgba(26,92,42,0.35);}
    .btn-request:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(26,92,42,0.45);color:white;}

    footer{position:relative;z-index:1;background:var(--g-dark);color:var(--g-light);text-align:center;padding:16px;font-size:0.82rem;font-weight:700;margin-top:auto;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

  <nav class="top-nav">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="icon-badge">🌿</span>
      Yard Services
    </a>
    <a href="{{ url_for('search_service') }}" class="nav-back">⬅ All Services</a>
  </nav>

  <div class="page-wrap">
    <div class="detail-card">

      {% if service.image_url %}
        <img src="{{ service.image_url }}" class="detail-img" alt="{{ service.name }}">
      {% else %}
        <div class="detail-img-placeholder">🌿</div>
      {% endif %}

      <div class="detail-header">
        <h2>{{ service.name }}</h2>
      </div>

      <div class="detail-body">
        {% if service.description %}
          <p class="detail-desc">{{ service.description }}</p>
        {% endif %}

        <div class="price-block">
          <span class="price-label">💵 Service Price</span>
          <span class="price-value">${{ "%.2f"|format(service.price|float) }}</span>
        </div>

        <a href="{{ url_for('request_service') }}" class="btn-request">
          🧹 Book This Service
        </a>
      </div>

    </div>
  </div>

  <footer>© 2025 Yard Services. All rights reserved. 🌿</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
