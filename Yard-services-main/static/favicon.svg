<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3318"/>
      <stop offset="100%" style="stop-color:#1a5c2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe57a"/>
      <stop offset="100%" style="stop-color:#d4870a"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#56c45e"/>
      <stop offset="100%" style="stop-color:#2d8a3e"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81d87e"/>
      <stop offset="100%" style="stop-color:#2d8a3e"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="inner">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Shield shape -->
  <path d="M60 4 L108 22 L108 62 Q108 94 60 116 Q12 94 12 62 L12 22 Z"
    fill="url(#bg)" filter="url(#s)"/>

  <!-- Shield inner border -->
  <path d="M60 12 L100 27 L100 62 Q100 88 60 107 Q20 88 20 62 L20 27 Z"
    fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.6"/>

  <!-- Large leaf left -->
  <path d="M60 68 Q32 52 30 28 Q50 34 60 68Z"
    fill="url(#leaf1)" opacity="0.95"/>

  <!-- Large leaf right -->
  <path d="M60 68 Q88 52 90 28 Q70 34 60 68Z"
    fill="url(#leaf2)" opacity="0.95"/>

  <!-- Center leaf (top) -->
  <path d="M60 68 Q56 44 60 22 Q64 44 60 68Z"
    fill="#a5d6a7" opacity="0.9"/>

  <!-- Stem -->
  <line x1="60" y1="68" x2="60" y2="92" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Roots / ground line -->
  <path d="M38 92 Q60 86 82 92" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M46 97 Q60 93 74 97" stroke="url(#gold)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Gold star / sparkle top center -->
  <g transform="translate(60,14)" fill="url(#gold)" filter="url(#inner)">
    <polygon points="0,-7 1.8,-2.5 6.6,-2.2 3,1.2 4.2,6.2 0,3.5 -4.2,6.2 -3,1.2 -6.6,-2.2 -1.8,-2.5" opacity="0.95"/>
  </g>

  <!-- Two small sparkles -->
  <g fill="url(#gold)" opacity="0.7">
    <polygon points="25,38 26.2,41.5 30,41.7 27.2,44 28.2,47.8 25,45.8 21.8,47.8 22.8,44 20,41.7 23.8,41.5" transform="scale(0.6) translate(17,22)"/>
    <polygon points="95,38 96.2,41.5 100,41.7 97.2,44 98.2,47.8 95,45.8 91.8,47.8 92.8,44 90,41.7 93.8,41.5" transform="scale(0.6) translate(-35,22)"/>
  </g>
</svg>
