<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <title>Sign Up — Yard Services</title>

  <script>atOptions={key:'d0fd3067ca9fd49b0435270473b5aef6',format:'iframe',height:60,width:468,params:{}};</script>
  <script src="https://www.highperformanceformat.com/d0fd3067ca9fd49b0435270473b5aef6/invoke.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5186647140863001" crossorigin="anonymous"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bitter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='themes/' + active_theme + '.css') }}">

  <style>
    body{ {% if bg_image %}background-image:url('{{ bg_image }}');background-position:{{ bg_position }};background-size:{{ bg_size }};background-repeat:{{ bg_repeat }};background-attachment:{{ bg_attachment }};{% endif %} }
  </style>

  <style>
    :root{--g-dark:#1a5c2a;--g-mid:#2d8a3e;--g-bright:#4caf50;--g-light:#c8e6c9;--g-pale:#f1f8f2;--gold:#f5a623;--gold-dark:#c47f00;--white:#ffffff;--ink:#1a2e1c;--muted:#6a8f70;--shadow:0 8px 36px rgba(26,92,42,0.16);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background-color:var(--g-pale);min-height:100vh;display:flex;flex-direction:column;position:relative;}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(170deg,rgba(76,175,80,0.05) 0px,rgba(76,175,80,0.05) 20px,transparent 20px,transparent 40px);pointer-events:none;z-index:0;}

    .top-nav{background:linear-gradient(90deg,var(--g-dark),var(--g-mid));padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 16px rgba(0,0,0,0.2);position:sticky;top:0;z-index:100;}
    .top-nav .brand{font-family:'Bitter',serif;font-size:1.2rem;font-weight:900;color:white;text-decoration:none;display:flex;align-items:center;gap:10px;}
    .top-nav .brand .icon-badge{background:var(--gold);color:var(--g-dark);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;}

    .page-wrap{position:relative;z-index:1;max-width:480px;margin:48px auto 0;padding:0 16px 60px;flex:1;width:100%;}

    .form-hero{background:linear-gradient(135deg,var(--g-dark) 0%,var(--g-mid) 60%,var(--g-bright) 100%);border-radius:20px 20px 0 0;padding:32px 36px 26px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow);}
    .form-hero::before{content:'🚀';font-size:110px;position:absolute;right:-14px;top:-18px;opacity:0.09;transform:rotate(10deg);}
    .form-hero .ring{width:64px;height:64px;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;}
    .form-hero h2{font-family:'Bitter',serif;font-size:1.8rem;font-weight:900;color:white;margin:0;}
    .gold-strip{height:5px;background:linear-gradient(90deg,var(--gold),#ffe082,var(--gold));}

    .form-card{background:var(--white);border-radius:0 0 20px 20px;border:2px solid var(--g-bright);border-top:none;box-shadow:var(--shadow);padding:32px;animation:fadeUp 0.4s ease 0.15s both;}

    .form-label{font-weight:800;font-size:0.88rem;color:var(--g-dark);margin-bottom:6px;display:block;}
    .form-control{border:2px solid var(--g-light);border-radius:10px;padding:11px 14px;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.95rem;transition:border-color 0.2s,box-shadow 0.2s;width:100%;}
    .form-control:focus{outline:none;border-color:var(--g-bright);box-shadow:0 0 0 3px rgba(76,175,80,0.18);}
    .form-group{margin-bottom:18px;}

    .tos-check{display:flex;align-items:flex-start;gap:10px;background:var(--g-pale);border:1.5px solid var(--g-light);border-radius:10px;padding:12px 14px;margin-bottom:20px;}
    .tos-check input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--g-bright);flex-shrink:0;}
    .tos-check label{font-size:0.88rem;font-weight:700;color:var(--ink);line-height:1.5;}
    .tos-check a{color:var(--g-mid);font-weight:800;}

    .btn-submit{display:block;width:100%;padding:14px;background:linear-gradient(135deg,var(--g-mid),var(--g-dark));color:white;font-family:'Bitter',serif;font-size:1.05rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;box-shadow:0 4px 18px rgba(26,92,42,0.35);}
    .btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(26,92,42,0.45);}

    .form-footer{text-align:center;margin-top:18px;font-size:0.9rem;font-weight:700;color:var(--muted);}
    .form-footer a{color:var(--g-mid);font-weight:800;text-decoration:none;}

    footer{position:relative;z-index:1;background:var(--g-dark);color:var(--g-light);text-align:center;padding:16px;font-size:0.82rem;font-weight:700;margin-top:auto;}

    @keyframes popIn{from{opacity:0;transform:scale(0.5);}to{opacity:1;transform:scale(1);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

  <nav class="top-nav">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="icon-badge">🌿</span>
      Yard Services
    </a>
  </nav>

  <div class="page-wrap">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, message in messages %}
        <div class="alert alert-{{ category }} mt-3" style="border-radius:10px;font-weight:700;">{{ message }}</div>
      {% endfor %}{% endif %}
    {% endwith %}

    <div class="form-hero">
      <div class="ring">🌱</div>
      <h2>Create Account</h2>
    </div>
    <div class="gold-strip"></div>

    <div class="form-card">
      <form method="POST">
        <div class="form-group">
          <label class="form-label">✉️ Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label class="form-label">🔒 Password</label>
          <input type="password" name="password" class="form-control" placeholder="Create a password" required>
        </div>
        <div class="form-group">
          <label class="form-label">📞 Phone Number</label>
          <input type="text" name="phone" class="form-control" placeholder="Your phone number">
        </div>

        <div class="tos-check">
          <input type="checkbox" id="tos" name="tos" required>
          <label for="tos">
            I agree to the <a href="{{ url_for('terms') }}">Terms of Service</a> and confirm I operate in or near Grindley Park Street.
          </label>
        </div>

        <button type="submit" class="btn-submit">🚀 Create Account</button>
      </form>
      <div class="form-footer">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
      </div>
    </div>

  </div>

  <footer>© 2025 Yard Services. All rights reserved. 🌿</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
