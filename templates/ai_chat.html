<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <title>Viora AI — Yard Services</title>
  <script>atOptions={key:'d0fd3067ca9fd49b0435270473b5aef6',format:'iframe',height:60,width:468,params:{}};</script>
  <script src="https://www.highperformanceformat.com/d0fd3067ca9fd49b0435270473b5aef6/invoke.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5186647140863001" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bitter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='themes/' + active_theme + '.css') }}">
  <style>body{ {% if bg_image %}background-image:url('{{ bg_image }}');background-position:{{ bg_position }};background-size:{{ bg_size }};background-repeat:{{ bg_repeat }};background-attachment:{{ bg_attachment }};{% endif %} }</style>
  <style>
    :root{--g-dark:#1a5c2a;--g-mid:#2d8a3e;--g-bright:#4caf50;--g-light:#c8e6c9;--g-pale:#f1f8f2;--gold:#f5a623;--gold-soft:#fff8e1;--gold-dark:#c47f00;--white:#ffffff;--ink:#1a2e1c;--muted:#6a8f70;--shadow:0 8px 36px rgba(26,92,42,0.16);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background-color:var(--g-pale);min-height:100vh;display:flex;flex-direction:column;position:relative;}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(170deg,rgba(76,175,80,0.05) 0px,rgba(76,175,80,0.05) 20px,transparent 20px,transparent 40px);pointer-events:none;z-index:0;}
    .top-nav{background:linear-gradient(90deg,var(--g-dark),var(--g-mid));padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 16px rgba(0,0,0,0.2);position:sticky;top:0;z-index:100;}
    .top-nav .brand{font-family:'Bitter',serif;font-size:1.2rem;font-weight:900;color:white;text-decoration:none;display:flex;align-items:center;gap:10px;}
    .top-nav .brand .icon-badge{background:var(--gold);color:var(--g-dark);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;}
    .nav-back{color:var(--g-light);font-size:0.85rem;font-weight:700;text-decoration:none;padding:6px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,0.25);transition:background 0.2s;}
    .nav-back:hover{background:rgba(255,255,255,0.15);color:white;}
    .page-wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:36px 16px 60px;flex:1;width:100%;}
    .form-hero{background:linear-gradient(135deg,#4a1a6b 0%,#7c3aed 100%);border-radius:20px 20px 0 0;padding:32px 36px 26px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow);}
    .form-hero::before{content:'🤖';font-size:110px;position:absolute;right:-14px;top:-18px;opacity:0.09;}
    .form-hero .ring{width:64px;height:64px;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;}
    .form-hero h2{font-family:'Bitter',serif;font-size:1.8rem;font-weight:900;color:white;margin:0;}
    .gold-strip{height:5px;background:linear-gradient(90deg,var(--gold),#ffe082,var(--gold));}
    .form-card{background:var(--white);border-radius:0 0 20px 20px;border:2px solid #7c3aed;border-top:none;box-shadow:var(--shadow);padding:0;animation:fadeUp 0.4s ease 0.15s both;}
    footer{position:relative;z-index:1;background:var(--g-dark);color:var(--g-light);text-align:center;padding:16px;font-size:0.82rem;font-weight:700;margin-top:auto;}
    #vioraMessages{height:400px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fafaff;}
    #vioraMessages::-webkit-scrollbar{width:5px;}
    #vioraMessages::-webkit-scrollbar-track{background:transparent;}
    #vioraMessages::-webkit-scrollbar-thumb{background:#d0d0e0;border-radius:10px;}
    .viora-typing span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7c3aed;margin:0 2px;animation:vioraBounce 1.4s infinite ease-in-out both;}
    .viora-typing span:nth-child(1){animation-delay:-0.32s;}
    .viora-typing span:nth-child(2){animation-delay:-0.16s;}
    .viora-typing span:nth-child(3){animation-delay:0s;}
    @keyframes vioraBounce{0%,80%,100%{transform:scale(0.6);}40%{transform:scale(1);}}
    @keyframes popIn{from{opacity:0;transform:scale(0.5);}to{opacity:1;transform:scale(1);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
  <nav class="top-nav">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="icon-badge">🌿</span>
      Yard Services
    </a>
    <a href="{{ url_for('dashboard') }}" class="nav-back">⬅ Dashboard</a>
  </nav>

  <div class="page-wrap">
    <div class="form-hero">
      <div class="ring">🤖</div>
      <h2>Viora AI</h2>
      <span style="display:inline-block;margin-top:8px;font-size:0.8rem;background:rgba(255,255,255,0.15);padding:3px 14px;border-radius:999px;color:#c4b5fd;font-weight:700;">🌿 Lawn & Yard Expert</span>
    </div>
    <div class="gold-strip"></div>
    <div class="form-card">
      <div id="vioraMessages">
        <div style="display:flex;gap:10px;align-items:flex-start;max-width:88%;">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">🌿</div>
          <div style="background:white;padding:12px 16px;border-radius:4px 16px 16px 16px;font-weight:600;font-size:0.9rem;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,0.06);line-height:1.5;">
            Hi! I'm Viora, your lawn & yard care assistant. Ask me anything about grass, gardening, trees, or yard services!
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;padding:12px 16px;border-top:1.5px solid #eee;background:white;">
        <input type="text" id="vioraInput" placeholder="Ask Viora about your lawn..."
               style="flex:1;padding:10px 16px;border:2px solid #e8e8f0;border-radius:25px;font-weight:600;font-size:0.9rem;outline:none;transition:border 0.2s;" onfocus="this.style.borderColor='#7c3aed'" onblur="this.style.borderColor='#e8e8f0'">
        <button onclick="sendViora()" style="background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;border:none;border-radius:25px;padding:10px 20px;font-weight:800;font-size:0.85rem;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,0.35);transition:transform 0.15s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">Send</button>
      </div>
    </div>
  </div>

  <footer>© 2025 Yard Services. All rights reserved. 🌿</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const vioraMsgs = document.getElementById('vioraMessages');
    const vioraInput = document.getElementById('vioraInput');
    vioraInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendViora(); });
    function addVioraMsg(text, sender, isTyping) {
      const wrapper = document.createElement('div');
      wrapper.style.cssText = sender === 'user'
        ? 'display:flex;gap:10px;align-items:flex-end;flex-direction:row-reverse;max-width:88%;align-self:flex-end;'
        : 'display:flex;gap:10px;align-items:flex-start;max-width:88%;';
      if (sender === 'bot' && !isTyping) {
        const avatar = document.createElement('div');
        avatar.style.cssText = 'width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;';
        avatar.textContent = '🌿';
        wrapper.appendChild(avatar);
      }
      if (sender === 'user') {
        const avatar = document.createElement('div');
        avatar.style.cssText = 'width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2d8a3e,#4caf50);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;';
        avatar.textContent = '👤';
        wrapper.appendChild(avatar);
      }
      const bubble = document.createElement('div');
      if (isTyping) {
        bubble.innerHTML = '<div class="viora-typing"><span></span><span></span><span></span></div>';
        bubble.style.cssText = 'background:white;padding:14px 18px;border-radius:4px 16px 16px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);';
      } else {
        bubble.textContent = text;
        bubble.style.cssText = sender === 'user'
          ? 'background:linear-gradient(135deg,#2d8a3e,#4caf50);color:white;padding:12px 16px;border-radius:16px 4px 16px 16px;font-weight:600;font-size:0.9rem;line-height:1.5;box-shadow:0 2px 8px rgba(45,138,62,0.2);'
          : 'background:white;padding:12px 16px;border-radius:4px 16px 16px 16px;font-weight:600;font-size:0.9rem;color:var(--ink);line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,0.06);';
      }
      wrapper.appendChild(bubble);
      vioraMsgs.appendChild(wrapper);
      vioraMsgs.scrollTop = vioraMsgs.scrollHeight;
      return wrapper;
    }
    async function sendViora() {
      const msg = vioraInput.value.trim();
      if (!msg) return;
      addVioraMsg(msg, 'user');
      vioraInput.value = '';
      const typingEl = addVioraMsg('', 'bot', true);
      try {
        const r = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: msg})
        });
        const d = await r.json();
        typingEl.remove();
        if (d.reply) addVioraMsg(d.reply, 'bot');
        else addVioraMsg('❌ ' + (d.error || 'AI unavailable'), 'bot');
      } catch(e) {
        typingEl.remove();
        addVioraMsg('❌ Network error. Check your connection.', 'bot');
      }
    }
  </script>
</body>
</html>
